<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chelsea & David Bailey</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    background:
        linear-gradient(rgba(0,0,0,.62), rgba(0,0,0,.62)),
        url("background.jpg");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    font-family: Georgia, serif;
    color: white;
    text-align: center;
}

.container {
    width: 90%;
    max-width: 600px;

    padding: 55px 30px;

    background: rgba(255,255,255,.10);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);

    border: 1px solid rgba(255,255,255,.25);
    border-radius: 12px;

    animation: elegantEntrance 2s ease-out forwards;
}

.monogram {
    font-size: 4rem;
    letter-spacing: 8px;
    margin-bottom: 25px;
}

h1 {
    font-size: 2rem;
    font-weight: normal;
    letter-spacing: 2px;
    margin-bottom: 20px;
}

.divider {
    width: 80px;
    height: 1px;
    background: white;
    opacity: .7;
    margin: 25px auto;
}

.message {
    font-size: 1.05rem;
    line-height: 1.8;
    opacity: .9;
}

.hashtag {
    margin-top: 35px;
    font-size: .95rem;
    letter-spacing: 3px;
}

@keyframes elegantEntrance {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 500px) {
    .monogram {
        font-size: 3rem;
    }

    h1 {
        font-size: 1.5rem;
    }

    .container {
        padding: 45px 25px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="monogram">C | D</div>

    <div class="divider"></div>

    <h1>Something Beautiful Is Coming</h1>

    <p class="message">
        Our wedding invitation experience is currently being prepared.
        <br><br>
        Please check back soon.
    </p>

    <div class="divider"></div>

    <div class="hashtag">#MeetTheBaileys</div>

</div>

</body>
</html>
