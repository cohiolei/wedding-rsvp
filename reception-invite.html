<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chelsea & David Bailey</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:
    linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),
    url("background.jpg");

    background-size:cover;
    background-position:center;
    background-attachment:fixed;

    font-family: Georgia, serif;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;

}

.container{

    width:90%;
    max-width:700px;

    background:rgba(255,255,255,.10);
    backdrop-filter:blur(12px);

    border:1px solid rgba(255,255,255,.25);

    border-radius:20px;

    padding:50px 35px;

    text-align:center;

}

h1{

    font-size:3rem;
    margin-bottom:15px;

}

h2{

    font-weight:normal;
    font-size:1.4rem;
    margin-bottom:35px;

}

p{

    line-height:1.8;
    font-size:1.1rem;
    margin-bottom:40px;

}

.button{

    display:block;

    width:100%;

    max-width:350px;

    margin:18px auto;

    padding:18px;

    text-decoration:none;

    background:#b08d57;

    color:white;

    border-radius:50px;

    font-size:1.1rem;

    transition:.3s;

}

.button:hover{

    background:#9a7846;

}

.footer{

    margin-top:40px;

    opacity:.9;

    font-size:1rem;

}

</style>

</head>

<body>

<div class="container">

<h1>Chelsea & David Bailey</h1>

<h2>You're Formally Invited</h2>

<p>

</p>

</a>

<a class="button" href="#" target="_blank">

</a>

</div>

</div>

</body>
</html>
